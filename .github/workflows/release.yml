# Parsica Recall release: build, check, and publish to a package index.
#
# Nothing is published automatically. This workflow runs only when a maintainer starts it
# by hand (Actions, release, Run workflow) and picks where the package goes. The publish
# job then waits in its environment (testpypi or pypi) until a required reviewer approves it.
#
# There is no API token anywhere. The package index trusts this exact workflow through
# trusted publishing (OpenID Connect): the publisher is registered on the index for
#   owner       Antaris-Analytics-LLC
#   repository  Parsica-Recall
#   workflow    release.yml
#   environment pypi        (testpypi on test.pypi.org)
#
# A version can be uploaded to a package index once. If a release is wrong, the fix is the
# next version number.

name: release

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Where to publish"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A release to pypi is cut from a version tag
        if: inputs.index == 'pypi'
        run: |
          version="$(python -c "import re; print(re.search(r'^HARNESS_VERSION = \"([^\"]+)\"', open('parsica_recall/recall_common.py').read(), re.M).group(1))")"
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo "run this workflow from the tag v$version, not from $GITHUB_REF"; exit 1; }
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build the wheel and the source archive
        run: |
          python -m pip install build
          python -m build
      - name: Check what was built against tools/dist_files.txt
        run: python tools/check_dist.py dist
      - name: Install the wheel into a clean environment and run it from an empty folder
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          "$RUNNER_TEMP/venv/bin/parsica-recall" --version
          "$RUNNER_TEMP/venv/bin/parsica-recall" run --adapter oracle --verify --output oracle.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.index }}
    permissions:
      id-token: write      # trusted publishing; this job holds no other permission and no secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
